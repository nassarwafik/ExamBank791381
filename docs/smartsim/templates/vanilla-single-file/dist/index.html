<!doctype html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Simulator</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:16px}
  main{display:flex;flex-direction:column;gap:12px}
  button{min-height:44px;font:inherit}
  button:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1 style="font-size:18px;margin:0">عنوان المحاكاة</h1>
  <p id="view"></p>
  <button id="act" type="button">إجراء</button>
</main>
<!-- Template A — vanilla single file. Paste docs/smartsim/sdk-v1.js content below (or implement the 4 messages yourself). -->
<script>
/* ↓ paste the content of docs/smartsim/sdk-v1.js here ↓ */
</script>
<script>
(function () {
  var state = { steps: 0 };
  function render(disabled) { document.getElementById("view").textContent = "الخطوات: " + state.steps; document.getElementById("act").disabled = !!disabled; }
  var sim = window.SmartSim.connect({
    onInit: function (ctx) { if (ctx.savedState && typeof ctx.savedState.steps === "number") state = ctx.savedState; render(ctx.disabled); },
    onRestore: function (s) { state = s && typeof s.steps === "number" ? s : { steps: 0 }; render(sim.isDisabled()); },
    onDisabled: function (d) { render(d); },
    onReset: function () { state = { steps: 0 }; render(false); sim.stateChanged(state); }
  });
  document.getElementById("act").addEventListener("click", function () { state.steps++; render(false); sim.stateChanged(state); });
})();
</script>
</body>
</html>
