<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Teacher C# lab bridge (bridge.js): a hidden same-origin frame of the teacher's book reader. Its OWN policy: nothing but its own
       scripts and worker, plus 'wasm-unsafe-eval' for the .NET WebAssembly runtime. The site's policy (scripts/content-security-policy.ts)
       is not widened. The site also sends this policy as a header for /csharp-lab/* (staticwebapp.config.json), so the worker has it. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="robots" content="noindex">
  <title>C# lab</title>
</head>
<body>
  <script type="module" src="./bridge.js"></script>
</body>
</html>
