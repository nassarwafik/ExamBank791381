<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#031c40" />
    <title>Tadris+ — لا يوجد اتصال بالإنترنت</title>
    <style>
      /* UX-R16 — the reference palette, as literals: this page is served offline and loads nothing, so it cannot read the
         design tokens (the values mirror --eb-bg, --eb-navy, --eb-surface, --eb-line, --eb-muted, --eb-primary, -strong).
         The brand mark and the theme colour keep the Tadris+ navy (BRAND-005). */
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
             background: #f7f6fa; color: #1c1330; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
      main { max-width: 420px; width: 100%; background: #ffffff; border: 1px solid #e9e8ee; border-radius: 8px; padding: 24px; text-align: center; }
      .mark { width: 56px; height: 56px; border-radius: 14px; background: #031c40; color: #fff; font-weight: 800; font-size: 22px;
              display: inline-flex; align-items: center; justify-content: center; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { margin: 0 0 20px; line-height: 1.7; color: #5f5a6e; }
      button { font: inherit; font-weight: 700; min-height: 44px; padding: 10px 20px; border-radius: 8px; border: 0; background: #2a0a4e; color: #ffffff; cursor: pointer; }
      button:focus-visible { outline: 3px solid #4a2380; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">T+</span>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p style="margin:0 0 8px;font-weight:800;color:#031c40">Tadris+ — التعليم المتكامل</p>
      <p>يحتاج Tadris+ إلى اتصال بالإنترنت لتسجيل الدخول وفتح الواجبات والامتحانات والرسائل. تحقّق من الاتصال ثم أعد المحاولة.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
