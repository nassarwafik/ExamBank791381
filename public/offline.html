<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>ExamBank — لا يوجد اتصال بالإنترنت</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
             background: #f5f7fa; color: #0f172a; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
      main { max-width: 420px; width: 100%; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 24px; text-align: center; }
      .mark { width: 56px; height: 56px; border-radius: 14px; background: #2563eb; color: #fff; font-weight: 800; font-size: 22px;
              display: inline-flex; align-items: center; justify-content: center; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { margin: 0 0 20px; line-height: 1.7; color: #334155; }
      button { font: inherit; font-weight: 700; min-height: 44px; padding: 10px 20px; border-radius: 10px; border: 0; background: #2563eb; color: #fff; cursor: pointer; }
      button:focus-visible { outline: 3px solid #0f172a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">EB</span>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>يحتاج ExamBank إلى اتصال بالإنترنت لتسجيل الدخول وفتح الواجبات والامتحانات والرسائل. تحقّق من الاتصال ثم أعد المحاولة.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
