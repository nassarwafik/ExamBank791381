# D2 — dependency updates (docs/enterprise-security-headers-d2.md §2). Dependabot opens pull requests; it never merges anything.
# Every update PR goes through the same Quality Gate as any other change and needs the owner's review and manual merge.
# Minor + patch updates are grouped into ONE pull request per directory per week; major updates come one by one (they can
# change behaviour and are reviewed on their own). The Coding Runner (runner/) has no npm dependencies.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      api-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
