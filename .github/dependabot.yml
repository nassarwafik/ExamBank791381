# D2 — dependency updates (docs/enterprise-security-headers-d2.md §2). Dependabot opens pull requests; it never merges anything.
# Every update PR goes through the same Quality Gate as any other change and needs the owner's review and manual merge.
# Minor + patch updates are grouped into ONE pull request per directory per week; major updates come one by one (they can
# change behaviour and are reviewed on their own). The Coding Runner (runner/) has no npm dependencies.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]
    # Owner decisions (2026-10-27, on the first Dependabot round):
    #  - TypeScript 7 is a native rewrite without the JavaScript compiler API that scripts/build-shared-finalization.mjs uses
    #    (Dependabot #466): stay on 6 until a planned migration phase.
    #  - React 19.3 grows the initial JS graph by ~8 KB gzip, over the 125 KB budget (Dependabot #465): React minors wait until the
    #    initial bundle has room. Patches of 19.2 still come.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: npm
    directory: "/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      api-minor-and-patch:
        update-types: ["minor", "patch"]
    # Owner decision (2026-10-27): pdf-parse stays on v1. v2 is a different API (require() returns an object, not a function), so
    # the bump (Dependabot #464) would break PDF import at runtime; api/tests/pdf-extract-real.test.js now parses a real PDF.
    ignore:
      - dependency-name: "pdf-parse"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
