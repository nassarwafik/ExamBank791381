name: Phase 21D-B Real Chromium WebGL Certification
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/meshModels/**"
      - "src/interactive3d/orbitCamera.ts"
      - "browser-harness/mesh-models-21db.*"
      - "browser-harness/mesh-anatomy-21db.*"
      - "scripts/check-mesh-models-browser-21db.mjs"
      - "scripts/check-mesh-anatomy-browser-21db.mjs"
      - "scripts/check-mesh-exam-browser-21db3.mjs"
      - "browser-harness/mesh-exam-21db3.*"
      - "src/meshPartSelectionQuestion.ts"
      - "src/questionTypes/student/MeshPartSelectionResponse.tsx"
      - "docs/fixtures/mesh-models-21db3/**"
      - "public/mesh-assets/**"
      - "docs/enterprise-realistic-3d-mesh-models-21d-b.md"
      - ".github/workflows/mesh-models-browser-21db.yml"
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: 21D-B WebGL depth picking context-loss mobile RTL
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Prepare dependencies and browser core
        run: |
          npm ci
          npm install --prefix /tmp/pw --no-save playwright-core@1.55.0
          command -v google-chrome
      - name: Certify the WebGL mesh viewer in real Chromium (ANGLE / SwiftShader, no GPU)
        env:
          PLAYWRIGHT_CORE_DIR: /tmp/pw
          CHROMIUM_PATH: /usr/bin/google-chrome
          HARNESS_OUT: .harness-21db
        run: node --experimental-strip-types scripts/check-mesh-models-browser-21db.mjs
      - name: Certify the anatomical library models and the authoring editor in real Chromium (orientation, picking, performance)
        env:
          PLAYWRIGHT_CORE_DIR: /tmp/pw
          CHROMIUM_PATH: /usr/bin/google-chrome
          HARNESS_OUT: .harness-21db
        run: node --experimental-strip-types scripts/check-mesh-anatomy-browser-21db.mjs
      - name: Certify the Arabic acceptance exam (six model questions, autosave / reload, grading, review, low memory, no WebGL) in real Chromium
        env:
          PLAYWRIGHT_CORE_DIR: /tmp/pw
          CHROMIUM_PATH: /usr/bin/google-chrome
          HARNESS_OUT: .harness-21db
        run: node --experimental-strip-types scripts/check-mesh-exam-browser-21db3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesh-models-21db-browser
          path: .harness-21db/
          include-hidden-files: true
          retention-days: 7
