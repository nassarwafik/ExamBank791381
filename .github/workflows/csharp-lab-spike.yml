name: Teacher C# Lab Spike
# Adds a job and weakens none (AGENTS.md §1, §12). Owner-approved SPIKE (docs/enterprise-teacher-csharp-lab-spike.md): build the
# teacher's in-browser C# compiler (Roslyn on .NET WebAssembly, tools/csharp-lab), then MEASURE it and PROVE it in real Chromium —
# download size (raw and Brotli), cold and warm start, compile / run times, output, input, compile and runtime errors, the book's
# wrap rule, and zero violations of the page's own strict CSP. Nothing here is deployed or served by the web app.
# The .NET SDK comes from Microsoft's official install script (no third-party action).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/csharp-lab/**"
      - "scripts/ds-course/unit4/**"
      - ".github/workflows/csharp-lab-spike.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: csharp-lab-spike-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  spike:
    name: Teacher C# lab — build, measure, prove in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the .NET 10 SDK (Microsoft's official script)
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 10.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
      - name: Toolchain
        run: dotnet --version
      - name: Publish the lab (Release, browser-wasm)
        working-directory: tools/csharp-lab
        run: dotnet publish -c Release -o out
      - name: Playwright core (browser driver only; Chrome is preinstalled on the runner)
        run: npm install --prefix /tmp/pw --no-save playwright-core@1.55.0
      - name: Measure and prove in Chromium
        env:
          PLAYWRIGHT_CORE_DIR: /tmp/pw
          CHROMIUM_PATH: /usr/bin/google-chrome
          REPORT_DIR: csharp-lab-report
        run: node tools/csharp-lab/smoke.mjs tools/csharp-lab/out/wwwroot
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: csharp-lab-spike-report
          path: csharp-lab-report/
          if-no-files-found: ignore
          retention-days: 14
