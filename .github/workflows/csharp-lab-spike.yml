name: Teacher C# Lab
# Adds a job and weakens none (AGENTS.md §1, §12). Owner-approved SPIKE (docs/enterprise-teacher-csharp-lab-spike.md): build the
# teacher's in-browser C# compiler (Roslyn on .NET WebAssembly, tools/csharp-lab), then MEASURE it and PROVE it in real Chromium —
# download size (raw and Brotli), cold and warm start, compile / run times, output, input, compile and runtime errors, the book's
# wrap rule, and zero violations of the page's own strict CSP. Nothing here is deployed or served by the web app.
# The .NET SDK comes from Microsoft's official install script (no third-party action).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/csharp-lab/**"
      - "scripts/ds-course/unit4/**"
      - "api/src/data/course-libraries/**"
      - "api/src/functions/student-tool-run.js"
      - "src/studentTools/**"
      - "src/learning/reader/LearningReader.tsx"
      - "src/learning/training/LearningReaderWithTraining.tsx"
      - "public/staticwebapp.config.json"
      - "scripts/check-csharp-lab-browser.mjs"
      - ".github/workflows/csharp-lab-spike.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: csharp-lab-spike-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  spike:
    name: Teacher C# lab — build, measure, prove in Chromium and in the site
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install the .NET 10 SDK (Microsoft's official script)
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 10.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
      - name: Toolchain
        run: dotnet --version
      - name: Publish the lab (Release, browser-wasm)
        working-directory: tools/csharp-lab
        run: dotnet publish -c Release -o out
      - name: Playwright core (browser driver only; Chrome is preinstalled on the runner)
        run: npm install --prefix /tmp/pw --no-save playwright-core@1.55.0
      - name: Measure and prove in Chromium
        env:
          PLAYWRIGHT_CORE_DIR: /tmp/pw
          CHROMIUM_PATH: /usr/bin/google-chrome
          REPORT_DIR: csharp-lab-report
        run: node tools/csharp-lab/smoke.mjs tools/csharp-lab/out/wwwroot
      # The lab in the REAL site (docs/enterprise-csharp-visual-lab-plan.md §9): the same files placed in public/csharp-lab/ the way the
      # deploy job places them, the production build, the real API in process — the teacher on a desktop runs programs on the device
      # (and recovers from a time-out and from a stack overflow); a phone and a student never get the lab. Adds a check, weakens none.
      - name: Place the lab in the site (as the deploy job does)
        run: |
          cd tools/csharp-lab/out/wwwroot
          find . -type f ! -name '*.br' ! -name '*.gz' -exec install -D -m 0644 {} "$GITHUB_WORKSPACE/public/csharp-lab/{}" \;
          test -f "$GITHUB_WORKSPACE/public/csharp-lab/index.html" && test -f "$GITHUB_WORKSPACE/public/csharp-lab/_framework/dotnet.js"
      - name: Production build with the lab, and the API
        run: |
          npm ci
          npm ci --prefix api
          npm run build
      - name: Prove the lab in the real site (teacher desktop / phone, student)
        env:
          PLAYWRIGHT_CORE_DIR: /tmp/pw
          CHROMIUM_PATH: /usr/bin/google-chrome
          SHOT_DIR: csharp-lab-report
        run: node scripts/check-csharp-lab-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: csharp-lab-spike-report
          path: csharp-lab-report/
          if-no-files-found: ignore
          retention-days: 14
