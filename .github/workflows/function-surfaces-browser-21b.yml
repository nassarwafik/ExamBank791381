name: Phase 21B Real Chromium Certification
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/functionSurfaces/**"
      - "src/richContent/RichContentRenderer.tsx"
      - "src/richContent/RichContentEditor.tsx"
      - "src/richContent/richContentModel.ts"
      - "browser-harness/function-surfaces.*"
      - "scripts/check-function-surface-browser-21b.mjs"
      - "docs/enterprise-3d-mathematical-surfaces-21b.md"
      - ".github/workflows/function-surfaces-browser-21b.yml"
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: 21B RTL mobile keyboard pointer print
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Prepare production assets and browser core
        run: |
          npm ci
          npm run build
          npm install --prefix /tmp/pw --no-save playwright-core@1.55.0
          command -v google-chrome
      - name: Certify real Chromium
        env:
          PLAYWRIGHT_CORE_DIR: /tmp/pw
          CHROMIUM_PATH: /usr/bin/google-chrome
          HARNESS_OUT: .harness-21b
        run: node scripts/check-function-surface-browser-21b.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: function-surfaces-21b-browser
          path: .harness-21b/
          retention-days: 7
