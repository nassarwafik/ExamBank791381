name: Phase 21A2 Mutation Certification
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/mutate-function-graphs-21a2.mjs"
      - "src/functionGraphs/**"
      - "src/functionGraphSelectionQuestion.ts"
      - "src/aiComposer/composerGraph.ts"
      - "src/aiComposer/composerGraph.21a2.test.ts"
      - "api/tests/certification-21a2/**"
      - ".github/workflows/function-graphs-mutation-21a2.yml"
permissions:
  contents: read
jobs:
  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    name: Graph mutation campaign — 39 isolated mutants
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          lfs: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix api
      - name: Run sequential baseline and 39 source mutations with SHA-256 restoration
        run: node scripts/mutate-function-graphs-21a2.mjs
      - name: Upload per-mutant ledger
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-21a2-mutations
          path: artifacts/phase-21a2/mutation-ledger.json
          retention-days: 14
