name: Phase 21A2 Real Chromium Certification
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/functionGraphs/**"
      - "browser-harness/function-graphs.*"
      - "scripts/check-function-graph-browser.mjs"
      - ".github/workflows/function-graphs-browser-21a2.yml"
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    name: 21A2 RTL mobile keyboard print
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Prepare production assets and browser core
        run: |
          npm ci
          npm run build
          npm install --prefix /tmp/pw --no-save playwright-core@1.55.0
          command -v google-chrome
      - name: Certify Chromium mobile desktop RTL keyboard and print
        env:
          PLAYWRIGHT_CORE_DIR: /tmp/pw
          CHROMIUM_PATH: /usr/bin/google-chrome
          HARNESS_OUT: .harness-21a2
        run: node scripts/check-function-graph-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: function-graphs-21a2-browser
          path: .harness-21a2/
          retention-days: 7
