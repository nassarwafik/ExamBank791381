name: Phase 21C Regenerate Shared Artifacts (temporary)
on:
  push:
    branches:
      - feature/21c-interactive-3d-objects-geometry
    paths:
      - ".github/workflows/phase21c-regenerate-shared.yml"
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/21c-interactive-3d-objects-geometry
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate shared server authority and 21C acceptance fixture
        run: |
          node scripts/build-shared-finalization.mjs
          node scripts/generate-interactive-3d-21c-fixture.mjs
      - name: Commit generated artifacts if needed
        run: |
          git add api/src/lib/shared-finalization docs/fixtures/interactive-3d-21c
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(21C): regenerate shared authority and acceptance fixture"
          git push origin HEAD:feature/21c-interactive-3d-objects-geometry
