name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  # Hard quality gate: the full Vitest suite and the production build must both
  # pass before any Azure deployment is attempted. This job never receives the
  # Azure deployment secret. Runs on push to main and on PR
  # opened/synchronize/reopened, but NOT on PR closed (nothing to test when we
  # are only tearing down a preview environment).
  quality_gate:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Quality Gate — Tests & Build
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Install app dependencies
        run: npm ci
      - name: Install API dependencies
        run: npm ci --prefix api
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build
      # Phase 11A — lint gate. oxlint exits non-zero only on ERROR-level findings (e.g. rules-of-hooks); the existing
      # warning baseline is reported in the log but does not fail the job.
      - name: Lint
        run: npm run lint

  build_and_deploy_job:
    # Only deploy after the quality gate passes; keep the original event guard.
    needs: quality_gate
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      # Teacher C# lab (docs/enterprise-csharp-visual-lab-plan.md, V1): publish the teacher's in-browser C# compiler into
      # public/csharp-lab/ (git-ignored) BEFORE the Static Web Apps build, which copies public/ into dist/. Proven by csharp-lab.yml on
      # the same head. Adds steps; changes no gate and no deployment setting.
      - name: Set up Node.js (C# lab build script)
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the .NET 10 SDK for the C# lab (Microsoft's official script)
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 10.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
      - name: Publish the teacher C# lab into public/csharp-lab
        run: node scripts/build-csharp-lab.mjs
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GRASS_0CE642C10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  # Independent of the quality gate: when a PR closes, Azure still needs to
  # remove its preview environment even if code would not build/test.
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GRASS_0CE642C10 }}
          action: "close"
