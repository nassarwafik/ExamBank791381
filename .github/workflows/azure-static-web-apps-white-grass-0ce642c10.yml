name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  # Hard quality gate: the full Vitest suite and the production build must both
  # pass before any Azure deployment is attempted. This job never receives the
  # Azure deployment secret. Runs on push to main and on PR
  # opened/synchronize/reopened, but NOT on PR closed (nothing to test when we
  # are only tearing down a preview environment).
  quality_gate:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Quality Gate — Tests & Build
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Install app dependencies
        run: npm ci
      - name: Install API dependencies
        run: npm ci --prefix api
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build
      # Phase 11A — lint gate. oxlint exits non-zero only on ERROR-level findings (e.g. rules-of-hooks); the existing
      # warning baseline is reported in the log but does not fail the job.
      - name: Lint
        run: npm run lint

  build_and_deploy_job:
    # Only deploy after the quality gate passes; keep the original event guard.
    needs: quality_gate
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      # Teacher C# lab (AGENTS.md §1; docs/enterprise-teacher-csharp-lab-spike.md): the in-browser C# compiler of the TEACHER's book
      # editor, built here and placed in public/csharp-lab/ so the build below copies it to dist/csharp-lab/ (served at /csharp-lab/,
      # loaded only in a sandboxed iframe by the teacher's reader). The .NET SDK comes from Microsoft's official install script. The
      # .br / .gz copies are left out (the host compresses). Proven in Chromium by .github/workflows/csharp-lab-spike.yml.
      - name: Install the .NET 10 SDK (teacher C# lab)
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 10.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
      - name: Build the teacher C# lab into public/csharp-lab
        run: |
          dotnet publish tools/csharp-lab -c Release -o "$RUNNER_TEMP/csharp-lab"
          cd "$RUNNER_TEMP/csharp-lab/wwwroot"
          find . -type f ! -name '*.br' ! -name '*.gz' -exec install -D -m 0644 {} "$GITHUB_WORKSPACE/public/csharp-lab/{}" \;
          test -f "$GITHUB_WORKSPACE/public/csharp-lab/index.html" && test -f "$GITHUB_WORKSPACE/public/csharp-lab/_framework/dotnet.js"
      # On-device Python lab (AGENTS.md §1; docs/enterprise-python-lab-spike.md): the pinned Pyodide release (CPython 3.13), REFUSED unless
      # its sha512 matches tools/python-lab/pyodide.json, placed with the lab page in public/python-lab/ (served at /python-lab/, loaded only
      # in a sandboxed iframe). Proven in Chromium by .github/workflows/python-lab-spike.yml.
      - name: Place the on-device Python lab into public/python-lab
        run: |
          node tools/python-lab/fetch-pyodide.mjs tools/python-lab/wwwroot
          cd tools/python-lab/wwwroot
          find . -type f -exec install -D -m 0644 {} "$GITHUB_WORKSPACE/public/python-lab/{}" \;
          test -f "$GITHUB_WORKSPACE/public/python-lab/index.html" && test -f "$GITHUB_WORKSPACE/public/python-lab/pyodide/pyodide.asm.wasm"
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GRASS_0CE642C10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  # Independent of the quality gate: when a PR closes, Azure still needs to
  # remove its preview environment even if code would not build/test.
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GRASS_0CE642C10 }}
          action: "close"
