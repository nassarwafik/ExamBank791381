name: Teacher C# Lab
# Adds a job and weakens none (AGENTS.md §1, §12). Teacher C# lab (docs/enterprise-teacher-csharp-lab-spike.md; phase V1 in
# docs/enterprise-csharp-visual-lab-plan.md; formerly csharp-lab-spike.yml): build the teacher's in-browser C# compiler (Roslyn on
# .NET WebAssembly, tools/csharp-lab) EXACTLY as the deploy job does (scripts/build-csharp-lab.mjs → public/csharp-lab), then:
#   1. MEASURE it and PROVE it in real Chromium through its frame and worker (tools/csharp-lab/smoke.mjs): size, cold / warm start,
#      output, input, compile and runtime errors, the book's classes, the time limit, bounded output, a recursion without end, a
#      sealed network, zero violations of its own strict CSP (also sent as the site's /csharp-lab/* header);
#   2. PROVE it in the REAL site: the production build with the lab, the real API in process (scripts/check-csharp-lab-browser.mjs):
#      the teacher's desktop reader runs programs in the browser, a phone and a student never get the lab.
# The .NET SDK comes from Microsoft's official install script (no third-party action). Nothing here is deployed.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/csharp-lab/**"
      - "scripts/build-csharp-lab.mjs"
      - "scripts/check-csharp-lab-browser.mjs"
      - "scripts/ds-course/unit4/**"
      - "src/studentTools/**"
      - "src/learning/reader/LearningReader.tsx"
      - "src/learning/training/LearningReaderWithTraining.tsx"
      - "api/src/functions/teacher-csharp-lab.js"
      - "api/src/lib/course-library.js"
      - "api/src/data/course-libraries/**"
      - "public/staticwebapp.config.json"
      - ".github/workflows/csharp-lab.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: csharp-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lab:
    name: Teacher C# lab — build, measure, prove in Chromium and in the site
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install the .NET 10 SDK (Microsoft's official script)
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 10.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
      - name: Toolchain
        run: dotnet --version
      - name: Publish the lab into the site (the deploy job's own step)
        run: node scripts/build-csharp-lab.mjs
      - name: Playwright core (browser driver only; Chrome is preinstalled on the runner)
        run: npm install --prefix /tmp/pw --no-save playwright-core@1.55.0
      - name: Measure and prove the lab in Chromium
        env:
          PLAYWRIGHT_CORE_DIR: /tmp/pw
          CHROMIUM_PATH: /usr/bin/google-chrome
          REPORT_DIR: csharp-lab-report
        run: node tools/csharp-lab/smoke.mjs public/csharp-lab
      - name: Production build with the lab, and the API
        run: |
          npm ci
          npm ci --prefix api
          npm run build
      - name: Prove the lab in the real site (teacher desktop / phone, student)
        env:
          PLAYWRIGHT_CORE_DIR: /tmp/pw
          CHROMIUM_PATH: /usr/bin/google-chrome
          SHOT_DIR: csharp-lab-report
        run: node scripts/check-csharp-lab-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: csharp-lab-report
          path: csharp-lab-report/
          if-no-files-found: ignore
          retention-days: 14
