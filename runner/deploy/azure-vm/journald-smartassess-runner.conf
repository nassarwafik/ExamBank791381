# Phase 17F-A1 — journald caps for the Runner VM. Install as /etc/systemd/journald.conf.d/smartassess-runner.conf, then
# `sudo systemctl restart systemd-journald`. journald writes to the OS disk (/var/log/journal), never to the journal data disk
# (/data/smartassess-runner), and is bounded here so logs can never fill the OS disk either.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=2G
SystemKeepFree=4G
SystemMaxFileSize=128M
MaxRetentionSec=30day
RateLimitIntervalSec=30s
RateLimitBurst=20000
